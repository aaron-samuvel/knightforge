projects:
  - name: knightforge
    environments:
      - name: production
        services:
          - type: web
            name: knightforge-web
            runtime: docker
            plan: free
            dockerfilePath: ./Dockerfile
            dockerContext: .
            healthCheckPath: /api/health
            autoDeployTrigger: commit
            envVars:
              - key: DATABASE_URL
                value: file:/app/db/custom.db
              - key: AUTH_SECRET
                generateValue: true
              - key: NEXT_PUBLIC_SITE_NAME
                value: KnightForge
              # NOTE: NEXT_PUBLIC_* vars are inlined into the client bundle at
              # BUILD time; Render injects them at RUNTIME, so the built web
              # app uses the /socket.io rewrite fallback (next.config.ts) and
              # the embedded realtime server inside the web container. Set
              # this var as a build arg if you want direct two-service socket
              # connections instead.
              - key: NEXT_PUBLIC_GAME_SERVER
                fromService:
                  type: web
                  name: knightforge-chess
                  envVarKey: RENDER_EXTERNAL_URL

          - type: web
            name: knightforge-chess
            runtime: docker
            plan: free
            dockerfilePath: ./mini-services/chess-game/Dockerfile
            dockerContext: .
            autoDeployTrigger: commit
            envVars:
              - key: KNIGHTFORGE_WEB_URL
                fromService:
                  type: web
                  name: knightforge-web
                  envVarKey: RENDER_EXTERNAL_URL

