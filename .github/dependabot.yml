# Dependabot — automated GitHub Actions version updates.
#
# NOTE: the npm ecosystem is intentionally NOT enabled here. This repo uses
# Bun with a bun.lockb lockfile, which Dependabot's npm updater cannot
# resolve — its runs fail and it would open lockfile-less PRs. Dependency
# bumps are handled manually (or with `bun update`) until Bun lockfiles are
# supported: https://github.com/dependabot/dependabot-core/issues/8935
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
